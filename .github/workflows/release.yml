name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image (python-${{ matrix.python-version }})
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args:
            PYTHON_VERSION: ${{ matrix.python-version }}
          tags: ghcr.io/${{ github.repository }}:python-${{ matrix.python-version }}-${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:python-${{ matrix.python-version }}-${{ steps.meta.outputs.tags }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  k8s-validate:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Kubernetes manifests (offline)
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary k8s/

  tag-bump:
    needs: [docker, k8s-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version in deployment files
        run: |
          VERSION=$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)
          sed -i "s|image: .*|image: ghcr.io/${{ github.repository }}:python-3.12-${VERSION}|g" k8s/deployment.yaml
          # Add other 2 deployment files when they exist
          git add k8s/deployment.yaml
          git commit -m "chore: bump image tag to ${VERSION}"
          git tag ${VERSION}
          git push origin main --tags