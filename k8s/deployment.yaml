apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: memory-app }
  template:
    metadata:
      labels: { app: memory-app }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: memory-app
          image: memory-app:local
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 400Mi, cpu: 200m }
          readinessProbe:
            httpGet: { path: /healthcheck, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthcheck, port: 8080 }