apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: memory-app }
  template:
    metadata:
      labels: { app: memory-app }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: memory-app
          image: ghcr.io/tripura-kant/gitops-devsecops-pipeline:initial
          ports:
            - containerPort: 8080
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits: { memory: 256Mi, cpu: 200m }
          readinessProbe:
            httpGet: { path: /healthcheck, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthcheck, port: 8080 }